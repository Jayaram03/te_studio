<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Travel Episodes Studio</title>
<link rel="icon" href="/static/brand/favicon.png">
<style>
  @font-face { font-family: Poppins; src: url(/static/fonts/Poppins-Light.ttf); font-weight: 300; font-display: swap }
  @font-face { font-family: Poppins; src: url(/static/fonts/Poppins-Regular.ttf); font-weight: 400; font-display: swap }
  @font-face { font-family: Poppins; src: url(/static/fonts/Poppins-Medium.ttf); font-weight: 500; font-display: swap }
  @font-face { font-family: Poppins; src: url(/static/fonts/Poppins-Bold.ttf); font-weight: 600 700; font-display: swap }
  :root { --lavender:#8286cb; --orange:#ef712c; --cream:#fae7b6; --lav-soft:#a5a4d4; --mist:#e2e3f3; --charcoal:#4f4c4d;
          --graphite:#5f6062; --surface:#fff; --page:#f6f6fb; --ink:#4f4c4d; --muted:#5f6062; --line:#c9c9dc; --err:#b42318; --err-bg:#fdecea }
  @media (prefers-color-scheme: dark) { :root { --surface:#4f4c4d; --page:#3f3d3e; --ink:#fff; --muted:#d3d2d2; --line:#77747a; --err:#ff8a80; --err-bg:#5a2e2b } }
  * { box-sizing: border-box } html, body { margin: 0; height: 100% }
  body { font: 15px/1.55 Poppins, system-ui, sans-serif; color: var(--ink); background: var(--page); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) }
  .art { background: var(--lavender); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 48px; color: #fff }
  .art .emblem { position: absolute; width: 58%; max-width: 420px; aspect-ratio: 1; border-radius: 50%; top: 14%; left: 50%; transform: translateX(-50%);
                 background: #fff url(/static/brand/emblem.png) center / 100% no-repeat; border: 10px solid #fff }
  .art h1 { font-size: 34px; line-height: 1.15; margin: 0 0 6px; font-weight: 700; max-width: 440px }
  .art p { font-size: 19px; font-weight: 600; margin: 0; max-width: 440px }
  .pill { position: absolute; width: 90px; height: 260px; border-radius: 9999px; background: var(--lav-soft); right: -40px; top: 60px }
  .dots { position: absolute; left: 44px; top: 40px; display: grid; grid-template-columns: repeat(9, 6px); gap: 9px 11px }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--lav-soft) }
  .dots i:nth-child(n+10):nth-child(-n+18), .dots i:nth-child(n+28) { background: var(--cream) }
  .panel { display: flex; align-items: center; justify-content: center; padding: 40px 24px }
  form { width: 100%; max-width: 380px }
  .logo { width: 210px; display: block; margin-bottom: 30px; background: #fff; border-radius: 16px; padding: 8px 10px }
  h2 { font-size: 26px; margin: 0 0 4px; font-weight: 600 } .sub { color: var(--muted); margin: 0 0 26px }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 16px }
  input { display: block; width: 100%; margin-top: 6px; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px }
  input:focus { outline: 2px solid var(--lavender); border-color: var(--lavender) }
  .pw { position: relative } .pw button { position: absolute; right: 8px; bottom: 7px; all: unset; position: absolute; right: 12px; bottom: 12px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500 }
  .go { width: 100%; font: inherit; font-weight: 600; font-size: 16px; padding: 13px; border: 0; border-radius: 9999px; background: var(--charcoal); color: #fff; cursor: pointer; margin-top: 6px }
  @media (prefers-color-scheme: dark) { .go { background: #fff; color: var(--charcoal) } }
  .go:disabled { opacity: .6; cursor: default }
  .err { background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; display: none }
  .hidden { display: none }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 18px 0 }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line) }
  .gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 9999px;
          border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; text-decoration: none }
  .gbtn:hover { border-color: var(--lavender) } .gbtn svg { width: 20px; height: 20px }
  .foot { margin-top: 28px; font-size: 13px; color: var(--muted) }
  @media (max-width: 820px) { body { grid-template-columns: minmax(0, 1fr) } .art { display: none } .panel { align-items: flex-start; padding-top: 48px } }
</style>
</head>
<body>
  <section class="art" aria-hidden="true">
    <div class="dots"></div><div class="pill"></div><div class="emblem"></div>
    <h1>Rates, trips and quotes in one place.</h1>
    <p>Travel Episodes Studio</p>
  </section>
  <main class="panel">
    <form id="f" novalidate>
      <img class="logo" src="/static/brand/logo.png" alt="Travel Episodes">
      <h2>Sign in</h2>
      <p class="sub">For Travel Episodes admins only.</p>
      <div class="err" id="err" role="alert"></div>
      <label>Email<input id="email" type="email" autocomplete="username" required autofocus></label>
      <label class="pw">Password<input id="password" type="password" autocomplete="current-password" required><button type="button" id="show">Show</button></label>
      <button class="go" id="go" type="submit">Sign in</button>
      <div id="google" class="hidden"><div class="or"><span>or</span></div>
        <a class="gbtn" id="gbtn" href="/auth/google/start"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</a></div>
      <p class="foot">Forgot your password? Ask another admin to reset it from Settings → Users.</p>
    </form>
  </main>
<script src="/static/login.js"></script>
</body>
</html>
