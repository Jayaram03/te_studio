[project]
name = "rate-ingest"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pypdfium2>=4.20",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "charset-normalizer>=3.3",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "reportlab>=4.0",
]
[tool.vercel]
entrypoint = "app.api:app"
